<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Principal 1 - Lecciones</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="home-body">

  <!-- Botón de cambio de tema idéntico al index -->
  <button class="theme-toggle" id="themeToggle">☀️ Mode</button>

  <div class="container">
    <nav class="site-nav" style="text-align: left; margin-bottom: 20px;">
      <a href="index.html">← Volver a Paneles</a>
    </nav>

    <h1>Panel Principal 1</h1>
    <p class="subtitle">Selecciona una lección para comenzar a estudiar.</p>

    <div class="button-grid">
      <!-- Lección 1 como botón principal -->
      <a href="leccion.html?id=pasado-simple" class="btn btn-main">
        <span class="btn-title">Lección 1</span>
        <span class="btn-desc">Simple Past (Regulares e Irregulares)</span>
      </a>

      <!-- Lección 2 (futura o en desarrollo) -->
      <a href="#" class="btn btn-main" style="opacity: 0.6; pointer-events: none;">
        <span class="btn-title">Lección 2</span>
        <span class="btn-desc">Próximamente (TBD)</span>
      </a>

      <!-- Botón ancho inferior para recursos extras o vocabulario -->
      <a href="#" class="btn btn-short" style="opacity: 0.6; pointer-events: none;">
        <span class="btn-title">Vocabulario y Recursos Extra</span>
        <span class="btn-desc">Material de apoyo</span>
      </a>
    </div>
  </div>

  <!-- Script para mantener sincronizado el tema (si usas script de theme) -->
  <script>
    // Si ya tienes un script para alternar light/dark, inclúyelo aquí también
    const toggleBtn = document.getElementById('themeToggle');
    const html = document.documentElement;

    // Cargar preferencia guardada si existe
    const savedTheme = localStorage.getItem('theme') || 'light';
    html.setAttribute('data-theme', savedTheme);
    toggleBtn.textContent = savedTheme === 'dark' ? '🌙 Mode' : '☀️ Mode';

    toggleBtn.addEventListener('click', () => {
      const currentTheme = html.getAttribute('data-theme');
      const newTheme = currentTheme === 'light' ? 'dark' : 'light';
      html.setAttribute('data-theme', newTheme);
      localStorage.setItem('theme', newTheme);
      toggleBtn.textContent = newTheme === 'dark' ? '🌙 Mode' : '☀️ Mode';
    });
  </script>
</body>
</html>
